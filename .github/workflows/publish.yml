name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      # No `version:` input — pnpm/action-setup reads the `packageManager` field so
      # the release build uses exactly the pnpm the repo is pinned to.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Releases are cut from tags, which may not have gone through a PR, so the
      # full gate runs again here rather than trusting an earlier CI run.
      - name: Verify (lint, types, tests)
        run: pnpm verify

      - name: Build package
        run: pnpm package

      - name: Publish to npm
        run: npm publish --provenance --access public
