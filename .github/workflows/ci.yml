name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

jobs:
  # Which parts of the repo a push or PR touches, so each job runs only when it can be
  # affected: a docs-only change does not rerun the library's unit and browser tests. A
  # skipped job still reports, so no required check is left pending. Manual runs run all.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lib: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.lib == 'true' }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          # What each group of jobs reads, directly or through tooling. When unsure whether a
          # path matters, it goes in: a missed trigger lands a broken change green.
          filters: |
            lib:
              - 'src/**'
              - 'tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.npmrc'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'postcss.config.cjs'
              - 'tailwind.config.mjs'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              # The docs site is built against the packaged library.
              - 'src/lib/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.npmrc'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'

  # Unfiltered: it takes about a minute and covers every file in the repo.
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The root ESLint config covers docs/ too, so a single run lints the whole repo.
      - name: Check formatting and lint
        run: pnpm lint

  typecheck:
    name: Type check
    needs: changes
    if: needs.changes.outputs.lib == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install docs dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Type check library
        if: needs.changes.outputs.lib == 'true'
        run: pnpm check

      # Builds dist/ first: the docs site consumes the package through a link:
      # dependency, so its types do not exist until the library is packaged.
      - name: Type check docs site
        if: needs.changes.outputs.docs == 'true'
        run: pnpm check:docs

  test:
    name: Unit tests (node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.lib == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm coverage

      - name: Upload coverage report
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  browser-tests:
    name: Browser tests (Chromium, Firefox)
    needs: changes
    if: needs.changes.outputs.lib == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The unit suite again in real engines, at 1x and 1.5x device scale, with real mouse
      # input; the browsers come in the version the locked @playwright/test expects.
      - name: Install Chromium and Firefox
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Run the unit suite in Chromium and Firefox
        run: pnpm test:browsers

  build:
    name: Package build
    needs: changes
    if: needs.changes.outputs.lib == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm package` runs svelte-package and then publint, so a broken exports map
      # or a missing dist file fails here rather than at release time.
      - name: Build and validate package
        run: pnpm package

  docs:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install docs dependencies
        run: pnpm --dir docs install --frozen-lockfile

      # Builds under the same base path GitHub Pages serves from, so a link that
      # only breaks when the site is not at the domain root fails CI here.
      - name: Build docs site
        run: pnpm --dir docs build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
